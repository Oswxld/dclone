name: Verify simulated balance sync
on:
  push:
    branches:
      - feature/per-user-sim-balance-sync
      - feature/confirmed-balance-refresh-admin-transfer
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
