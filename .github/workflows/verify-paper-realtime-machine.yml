name: Verify paper balance realtime state machine
on:
  push:
    branches: [feature/paper-balance-realtime-state-machine]
  workflow_dispatch:
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/paper-balance-realtime-machine.test.mjs tests/paper-balance-realtime-controller.test.mjs
      - run: npm ci
      - run: npm run build
